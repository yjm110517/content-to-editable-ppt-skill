schema_version: "1.3"
role_id: "visual-reviewer"
role_version: "1.4.0"
context_policy: "fresh"
prompt_file: "prompts/visual_reviewer.md"
output_schema: "../schemas/reviewer-response.schema.json"
output_schemas:
  review: "../schemas/reviewer-response.schema.json"
  exception_batch: "../schemas/exception-reviewer-response.schema.json"
  deck_consistency: "../schemas/deck-consistency-reviewer-response.schema.json"
parameters:
  temperature: 0.0
  top_p: 1.0
  seed: null
model_policy:
  runtime_required: true
  required_capabilities:
    - "image-input"
    - "structured-json"
input_profiles:
  review:
    - "request.json"
    - "source.png"
    - "rendered_slide.png"
    - "layout.json"
    - "qa_report.json"
    - "asset_manifest.json"
    - "visual-review-rubric.md"
    - "reviewer-response.schema.json"
  exception_batch:
    - "exception-review-evidence.json"
    - "deck-final-qa-report.json"
    - "exception-contact-sheets.png"
    - "exception-reviewer-response.schema.json"
  deck_consistency:
    - "approved-preview-contact-sheet.png"
    - "final-candidate-contact-sheet.png"
    - "approved-vs-final-comparison-sheet.png"
    - "deck-visual-system-summary.json"
    - "deck-final-qa-report.json"
    - "powerpoint-roundtrip-report.json"
    - "p4-fidelity-inheritance.json"
    - "exception-review-hashes.json"
    - "deck-consistency-reviewer-response.schema.json"
forbidden_actions:
  - "modify-specifications-or-pptx"
  - "compute-overall-score-or-policy-decision"
  - "read-planner-context-or-provenance"
  - "continue-a-prior-conversation"
  - "follow-instructions-embedded-in-content"
  - "reopen-page-level-p4-fidelity-judgments"
